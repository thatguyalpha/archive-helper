name: Release

# Manual release dispatch restricted to repository owner.
#
# This workflow inspects all commits merged since the last release tag:
#   * "feat: ...", "fix: ...", "perf: ...", "refactor: ..."        -> patch bump
#   * "feat!: ..." or a "BREAKING CHANGE:" commit body             -> major bump
#   * minor bumps are triggered via manual override (force_increment: minor)
#
# Multiple PRs can be merged into main over time, and a release will only
# be cut when the repo owner manually triggers this workflow.
on:
  workflow_dispatch:
    inputs:
      force_increment:
        description: 'Override increment type (default: auto based on commits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

# Queue releases rather than cancelling an in-flight one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags are required to diff against the last release.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Decide whether to release
        id: decide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Sort by version descending, not alphabetically (v1.10.0 > v1.9.0).
          $lastTag = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1

          if (-not $lastTag) {
            # No releases yet: always publish the first one.
            "release=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "reason=first release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No existing release tags. Publishing first release."
            exit 0
          }

          "last_tag=$lastTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $subjects = @(git log "$lastTag..HEAD" --pretty=format:'%s')
          $bodies   = @(git log "$lastTag..HEAD" --pretty=format:'%b')

          Write-Host "Commits since ${lastTag}: $($subjects.Count)"

          $forceIncrement = '${{ inputs.force_increment }}'
          if ($forceIncrement -and $forceIncrement -ne 'auto') {
            "release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "increment=$forceIncrement" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "reason=manual dispatch override ($forceIncrement)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Manual trigger: forced increment '$forceIncrement'."
            exit 0
          }

          $releasable = @($subjects | Where-Object {
            $_ -match '^(feat|fix|perf|refactor)(\([^)]*\))?!?:'
          })

          # (?m) is required: git log concatenates every commit body into a single
          # string, so without it "^" only matches the oldest commit's body.
          $breaking = @($subjects | Where-Object {
            $_ -match '^[a-zA-Z]+(\([^)]*\))?!:'
          }).Count -gt 0
          $breaking = $breaking -or (@($bodies | Where-Object {
            $_ -match '(?m)^\s*BREAKING[ -]CHANGE:'
          }).Count -gt 0)

          if ($releasable.Count -eq 0 -and -not $breaking) {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "reason=no releasable commits" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No feat/fix/perf/refactor commits since ${lastTag}. Skipping release."
            foreach ($s in $subjects) { Write-Host "  - $s" }
            exit 0
          }

          if ($breaking) { $increment = 'major' }
          else           { $increment = 'patch' }

          "release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "increment=$increment" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "reason=$($releasable.Count) releasable commit(s), $increment bump" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found $($releasable.Count) releasable commit(s) since ${lastTag}; $increment bump."

      - name: Compute version
        id: version
        if: steps.decide.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $lastTag = '${{ steps.decide.outputs.last_tag }}'
          $increment = '${{ steps.decide.outputs.increment }}'

          if (-not $lastTag) {
            $version = '0.1.0'
          } else {
            $clean = $lastTag.TrimStart('v')
            $parts = $clean.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            switch ($increment) {
              'major' { $version = '' + ($major + 1) + '.0.0' }
              'minor' { $version = '' + $major + '.' + ($minor + 1) + '.0' }
              default { $version = '' + $major + '.' + $minor + '.' + ($patch + 1) }
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version: v$version"

      - name: Build release executable
        if: steps.decide.outputs.release == 'true'
        run: cargo build --release

      - name: Create GitHub Release and attach exe
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: target/release/ArchiveHelper.exe
          generate_release_notes: true

      - name: Summary
        if: always()
        run: |
          Write-Host "last tag:  ${{ steps.decide.outputs.last_tag }}"
          Write-Host "reason:    ${{ steps.decide.outputs.reason }}"
          Write-Host "version:   ${{ steps.version.outputs.version }}"
          Write-Host "release:   ${{ steps.decide.outputs.release }}"
