name: Release

# On a version tag (e.g. v1.0.0), publish the single-file .exe to a GitHub Release.
# This mirrors publish.bat so the released binary matches local output.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file executable
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o ./publish

      - name: Create GitHub Release and attach exe
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ArchiveHelper.exe
          generate_release_notes: true
