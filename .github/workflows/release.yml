name: Release

# Automatically version and release on every push to main.
#
# The version is computed by MinVer (see ArchiveHelper.csproj) from git tags.
# This workflow only decides WHETHER to cut a release.
#
# Release policy - a release is cut only when at least one commit since the
# last release tag is explicitly releasable:
#   * "feat: ..." or "feat(scope): ..."                            -> minor bump
#   * "fix: ..."  / "perf: ..." / "refactor: ..."                 -> patch bump
#   * "feat!: ..." or a "BREAKING CHANGE:" commit body             -> major bump
#
# Anything else does NOT trigger a release. This deliberately includes:
#   * freeform commit messages ("Update README with ...")
#   * docs / chore / ci / test / style / build
# So editing the README will not publish a new build.
#
# MinVer is configured with MinVerTagPrefix=v to match the v1.2.3 tag format.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Queue releases rather than cancelling an in-flight one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags are required to diff against the last release.
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Decide whether to release
        id: decide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Sort by version descending, not alphabetically (v1.10.0 > v1.9.0).
          $lastTag = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1

          if (-not $lastTag) {
            # No releases yet: always publish the first one.
            "release=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "reason=first release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No existing release tags. Publishing first release."
            exit 0
          }

          "last_tag=$lastTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $subjects = @(git log "$lastTag..HEAD" --pretty=format:'%s')
          $bodies   = @(git log "$lastTag..HEAD" --pretty=format:'%b')

          Write-Host "Commits since ${lastTag}: $($subjects.Count)"

          $releasable = @($subjects | Where-Object {
            $_ -match '^(feat|fix|perf|refactor)(\([^)]*\))?!?:'
          })

          $breaking = @($subjects | Where-Object {
            $_ -match '^[a-zA-Z]+(\([^)]*\))?!:'
          }).Count -gt 0
          $breaking = $breaking -or (@($bodies | Where-Object {
            $_ -match '^\s*BREAKING[ -]CHANGE:'
          }).Count -gt 0)

          if ($releasable.Count -eq 0 -and -not $breaking) {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "reason=no releasable commits" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No feat/fix/perf/refactor commits since ${lastTag}. Skipping release."
            foreach ($s in $subjects) { Write-Host "  - $s" }
            exit 0
          }

          "release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "reason=$($releasable.Count) releasable commit(s)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found $($releasable.Count) releasable commit(s) since ${lastTag}."

      - name: Compute version with MinVer
        id: version
        if: steps.decide.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # MinVer returns e.g. "0.1.0-alpha.0.3" while there are unreleased
          # commits. Strip the prerelease suffix: the tag we create IS the
          # release, so the committed version is what we publish.
          $computed = (dotnet msbuild ArchiveHelper.csproj -t:MinVer -getProperty:MinVerVersion -nologo | Out-String).Trim()
          Write-Host "MinVer computed: $computed"

          $version = ($computed -split '-')[0].Trim()

          "version=$version"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "computed=$computed"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version: v$version"

      - name: Publish single-file executable
        if: steps.decide.outputs.release == 'true'
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o ./publish

      - name: Create GitHub Release and attach exe
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: publish/ArchiveHelper.exe
          generate_release_notes: true

      - name: Summary
        if: always()
        run: |
          Write-Host "last tag:  ${{ steps.version.outputs.last_tag }}"
          Write-Host "reason:    ${{ steps.decide.outputs.reason }}"
          Write-Host "minver:    ${{ steps.version.outputs.computed }}"
          Write-Host "version:   ${{ steps.version.outputs.version }}"
          Write-Host "release:   ${{ steps.decide.outputs.release }}"
