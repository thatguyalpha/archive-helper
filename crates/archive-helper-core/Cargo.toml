[package]
name = "archive-helper-core"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
dunce = "1.0.5"
fastrand = "2.5.0"
filetime = "0.2.29"
normpath = "1.5.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tracing = "0.1.44"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate", "time"] }
