[package]
name = "archive-helper-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ArchiveHelper"
path = "src/main.rs"

[dependencies]
archive-helper-core = { path = "../archive-helper-core" }
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rfd = "0.17"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", default-features = false }
